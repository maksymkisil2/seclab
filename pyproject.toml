[project]
name = "seclab"
version = "0.5.0"
description = "Lightweight local lab: isolated networks, hardening profiles, audit targets"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
seclab = "seclab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["seclab"]

[tool.setuptools.package-data]
seclab = ["scenarios/*.toml", "ui_static/*", "bin/seclab-agent-*"]

[tool.pytest.ini_options]
markers = ["integration: needs a running docker/podman daemon"]
