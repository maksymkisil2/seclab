[project]
name = "seclab"
version = "0.1.0"
description = "Lightweight local lab: isolated networks, hardening profiles, audit targets"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
seclab = "seclab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["seclab"]

[tool.pytest.ini_options]
markers = ["integration: needs a running docker/podman daemon"]
