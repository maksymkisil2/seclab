<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>seclab</title>
<style>
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0f1216; color: #d6dde6; font: 15px ui-monospace, Menlo, Consolas, monospace; }
  .box { text-align: center; }
  .spin { width: 22px; height: 22px; margin: 0 auto 14px; border: 3px solid #2a313b; border-top-color: #4fb3ff;
          border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .dim { color: #7d8794; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body><div class="box"><div class="spin"></div>starting seclab engine…<div class="dim">first start on Windows wakes up WSL2</div></div></body>
</html>
